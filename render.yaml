services:
  - type: web
    name: memory-scrapbook
    runtime: node
    # Free plan is fine: the diary lives in an external Postgres (Neon), not on Render's disk.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_TTL_DAYS
        value: "14"
      # Paste your Neon connection string in the Render dashboard (never commit it).
      - key: DATABASE_URL
        sync: false
      # Auto-generated; needed once, on the first-run "Create my diary" screen,
      # so strangers cannot claim your diary.
      - key: SETUP_TOKEN
        generateValue: true
